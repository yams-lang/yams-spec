name: test

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  conformance:
    name: conformance manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Deliberately dependency-free: a specification repository must be
      # checkable without any one language's toolchain. Implementations run
      # the suite themselves; this only proves the suite is coherent.
      - name: Every case is listed, and every listing exists
        run: python3 .github/scripts/check-conformance.py
